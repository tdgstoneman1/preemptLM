[project]
name = "preempt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "attrs>=26.1.0",
    "cividis>=0.0.2",
    "colorblind>=0.0.9",
    "compressed-tensors>=0.15.0",
    "datasets>=5.0.1",
    "fastmcp>=3.4.5",
    "icecream>=2.2.0",
    "matplotlib>=3.11.1",
    "mlx>=0.32.0",
    "mlx-lm>=0.31.3",
    "numpy>=1.26.0",
    "parquet-tools>=0.2.16",
    "pillow>=12.3.0",
    "plotly>=6.9.0",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-async>=0.1.1",
    "pytest-asyncio>=1.4.0",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "starlette>=1.3.1",
    "statsmodels>=0.14.6",
    "tokenizers>=0.22.2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.14.1",
    "uvicorn>=0.52.0",
    "viridis>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
markers = [
    "slow: long-running tests, excluded from the default fast loop",
    "integration: tests needing real weights or the macOS host",
]
