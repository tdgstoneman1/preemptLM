version = 1

[llm]
model_id = "converted-models/qwen3.6-35b"
backend = "mlx_metal"
architecture = "qwen3-next"

[generation_settings]
max_tokens = 4096
prefill_chunk_size = 512

[stream_settings]
expert_bank_path = "../../expert-bank/qwen3.6-35b"
